
<div class="hospitals-container">
    <div class="hospitals-title">
        <div class="title-group">
            <h2>Hospitais</h2>
            <span class="subtitle">Gerencie os hospitais cadastrados</span>
        </div>
        <div class="header-actions">
            <span class="p-input-icon-left search-field">
                <i class="pi pi-search"></i>
                <input pInputText type="text" placeholder="Buscar hospital" [(ngModel)]="searchTerm" />
            </span>
            <p-button label="Novo hospital" icon="pi pi-plus" (click)="createHospital()" />
        </div>
    </div>
    <p-tieredMenu #menu [model]="menuItems" [popup]="true" />

    <p-table [value]="filteredHospitals()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>Hospital</th>
                <th>Endereço</th>
                <th>Ações</th>
            </tr>
        </ng-template>
        <ng-template #body let-hospital>
            <tr>
                <td>{{ hospital.name }}</td>
                <td>{{ hospital.address }}</td>
                <td>
                    <p-button
                        icon="pi pi-ellipsis-v"
                        [rounded]="true"
                        [text]="true"
                        severity="secondary"
                        (click)="openMenu($event, hospital)"
                    />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
