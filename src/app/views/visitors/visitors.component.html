<div class="visitors-container">
    <div class="visitors-title">
        <div class="title-group">
            <h2>Visitantes</h2>
            <span class="subtitle">Gerencie os visitantes cadastrados</span>
        </div>
        <div class="header-actions">
            <span class="p-input-icon-left search-field">
                <i class="pi pi-search"></i>
                <input pInputText type="text" placeholder="Buscar visitante" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" />
            </span>
            <p-button label="Novo visitante" icon="pi pi-plus" (click)="createVisitor()" />
        </div>
    </div>
    <p-tieredMenu #menu [model]="menuItems" [popup]="true" />

    <p-table [value]="filteredVisitors()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>Visitante</th>
                <th>Data de Nascimento</th>
                <th>Email Jwpub</th>
                <th>Email Pessoal</th>
                <th>Telefone</th>
                <th>Ações</th>

            </tr>
        </ng-template>
        <ng-template #body let-visitor>
            <tr>
                <td>{{ visitor.name }}</td>
                <td>{{ visitor.birthDate | date: 'dd/MM/yyyy' }}</td>
                <td>{{ visitor.emailJwpub }}</td>
                <td>{{ visitor.emailPersonal }}</td>
                <td>{{ visitor.phoneNumber }}</td>
                <td>
                    <p-button
                        icon="pi pi-ellipsis-v"
                        [rounded]="true"
                        [text]="true"
                        severity="secondary"
                        (click)="openMenu($event, visitor)"
                    />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
